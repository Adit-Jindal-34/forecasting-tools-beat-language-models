# CYCLE 3 - H3 on REAL data, backbone strength. PREREGISTRATION_C3.md C3-1.
#
# L=128, ONE cell, THREE arms, the seven-rung Qwen2.5 ladder, on the
# contamination-controlled pool. This is also the CROSS-ARM HEADLINE run:
# "no LLM beats seasonal naive; the tool does" is a claim about arms, so it
# may only be made on a pool where the forecaster's training corpus is
# known to exclude the data. Every dataset here is Chronos Benchmark II
# (arXiv:2403.07815, Table 2).
#
# ⚠ WHAT IS STILL NOT CONTROLLED. Benchmark II settles contamination for
# CHRONOS, i.e. for the harness arm. It says nothing about the BARE arm:
# these archives are public text and Qwen2.5 may carry the literal values
# from pretraining. The asymmetry runs AGAINST the harness - if the bare arm
# has memorised anything, the measured harness advantage is an underestimate
# - so a positive result is conservative and a null one is not interpretable
# as "the tool does not help". C3-8 states this; do not quietly drop it.
#
# THREE ARMS, NOT FOUR (C3-9). `bare_features` is dropped from the wide
# ladder and kept on the 32B L-sweep. On synthetic forecasting it measured
# three independent nulls (-0.009, -0.017, +0.003) and was actively worse at
# 72B, so paying for it at thirteen rungs buys little; keeping it at one
# backbone keeps the "real series have structure, so computed features may
# help more there" question alive. `harness_oracle` is kept everywhere and
# is nearly FREE on a forecasting-only cell: it is handed the op, so it
# issues no routing call, and its Chronos forecast is bit-identical to the
# harness's and hits the TSFM cache. It is also the only thing that
# separates "the forecaster is worse here" from "the router failed here",
# which matters because cycle-2 forecasting routing was 0.83 at 0.5B.
#
#   slurm/submit.sh slurm/h3.sbatch c3 --array=0-6 \
#       --export=ALL,TSARCH_H3_CONFIG=configs/c3_h3_clean.yaml
seed: 20261114
out_dir: results/c3_h3_clean

# BYTE-IDENTICAL data block to c3_h1_clean.yaml, so both draw the same 300
# series and a shared --cache-dir makes H1's L=128 rung and this run's 32B
# rung pay for their identical prompts once.
data:
  name: real
  design: c2
  pool_dir: data-real/pool_clean_n300
  pool_sha256: 5e7fade71450e8ae1aacd183edfc8fd9218694a6c9509bb295730d3ae2df6538
  max_history: 512
  horizon: 24

history_lengths: [128]

query_types:
  - {name: forecasting, kind: forecast}

backbones:
  qwen2_5_0_5b:
    provider: openai_compatible
    model: Qwen/Qwen2.5-0.5B-Instruct
    strength: 0.150
    params: &vllm
      base_url: http://127.0.0.1:8000/v1
      api_key: none
      temperature: 0.0
      max_tokens: 1024
  qwen2_5_1_5b:
    provider: openai_compatible
    model: Qwen/Qwen2.5-1.5B-Instruct
    strength: 0.324
    params: *vllm
  qwen2_5_3b:
    provider: openai_compatible
    model: Qwen/Qwen2.5-3B-Instruct
    strength: 0.437
    params: *vllm
  qwen2_5_7b:
    provider: openai_compatible
    model: Qwen/Qwen2.5-7B-Instruct
    strength: 0.563
    params: *vllm
  qwen2_5_14b:
    provider: openai_compatible
    model: Qwen/Qwen2.5-14B-Instruct
    strength: 0.637
    params: *vllm
  qwen2_5_32b:
    provider: openai_compatible
    model: Qwen/Qwen2.5-32B-Instruct
    strength: 0.690
    params: *vllm
  qwen2_5_72b:
    provider: openai_compatible
    model: Qwen/Qwen2.5-72B-Instruct
    strength: 0.711
    params: *vllm

systems:
  - {name: bare_llm,       kind: bare_llm,     backbone: qwen2_5_0_5b}
  - {name: harness,        kind: harness_tsfm, backbone: qwen2_5_0_5b, routing: self}
  - {name: harness_oracle, kind: harness_tsfm, backbone: qwen2_5_0_5b, routing: oracle}

tsfm:
  name: chronos
  model_id: amazon/chronos-t5-small
  device_map: cuda
  torch_dtype: bfloat16
  num_samples: 20

judge: {enabled: false}

scoring:
  tol: 0.05
  loc_tol: 2
  fixed_mase_denominator: true

analysis:
  alpha: 0.05
  min_effect: 0.02
  min_n_per_cell: 255
  n_boot: 5000
  correction: holm
  confirmatory_contrast: [bare_llm, harness]
  confirmatory_family: [forecasting]
  secondary_contrast: [harness, harness_oracle]
  # `bare_features` is absent from this run, so no extra contrast can be
  # formed. Declared empty rather than omitted, so the asymmetry with
  # c3_h1_clean.yaml is on the record (C3-9).
  extra_contrasts: []
  framing_variance_threshold: 0.20
  cluster_unit: sample_id
  cluster_unit_sensitivity: [dataset_id]

  ladder: [qwen2_5_0_5b, qwen2_5_1_5b, qwen2_5_3b, qwen2_5_7b, qwen2_5_14b, qwen2_5_32b, qwen2_5_72b]
  robustness_backbones: []
  # Unchanged from C2: the 0.5B rung cannot operate the harness, so a
  # contrast anchored there measures routing collapse, not architecture.
  did_endpoints: [qwen2_5_3b, qwen2_5_72b]
  strength_metric: "MMLU-Pro, accuracy / 100 (vendor self-reported)"
  strength_source: "https://qwenlm.github.io/blog/qwen2.5-llm/ (Qwen2.5-*-Instruct tables)"
  strength_retrieved: "2026-11-06"
  strength_alt_metric: "MMLU-redux, accuracy / 100 (Qwen self-reported)"
  strength_alt:
    qwen2_5_0_5b: 0.241
    qwen2_5_1_5b: 0.507
    qwen2_5_3b: 0.644
    qwen2_5_7b: 0.754
    qwen2_5_14b: 0.8
    qwen2_5_32b: 0.839
    qwen2_5_72b: 0.868

harness:
  numeric_final: direct
  assist_qualitative: true

# Execution only: how many items are sent to the model server at once. Not
# part of any fingerprint or cache key, and tests/test_parallel.py checks
# the scored output is the same as with `workers: 1`. Set it to 1 to run
# one request at a time, as cycle 2 did.
inference:
  workers: 8
